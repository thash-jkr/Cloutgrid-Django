services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/logs:/app/logs
    env_file: 
      - ./backend/.env
    depends_on:
      - db
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - default

  db:
    image: postgres:13-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: thash
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: cloutgrid
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
